# Type-checks the repository and runs the test suites on every pull request and every push to main.
# No API keys: the tests never call a model (the subscription tools are faked).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (pnpm version from package.json's packageManager)
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @helix/core test
      - run: pnpm --filter @helix/server test
        if: runner.os != 'Windows'
      # The subscription-tool adapter tests fake each tool with a #!/bin/sh script, which Windows
      # can't run. Windows still runs windows-shim.test.ts, which starts a real npm-style .cmd shim.
      - run: pnpm --filter @helix/server exec vitest run --exclude "**/adapters.test.ts"
        if: runner.os == 'Windows'
      - run: pnpm --filter @helix/evals test
