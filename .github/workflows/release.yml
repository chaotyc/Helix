# Builds the desktop app for macOS (Apple silicon and Intel), Windows, and Linux, and puts the files
# on a draft GitHub Release for review. See apps/desktop/README.md ("Releases").
#
#   Push a tag vX.Y.Z    build, then create the draft release vX.Y.Z (the tag must match "version" in
#                        apps/desktop/package.json, or nothing is built).
#   Run it by hand       on a tag: the same. On a branch: a dry run; the files are kept on the
#                        workflow run (Summary → Artifacts) and no release is made.
#
# Signing is optional. With none of these repository secrets the builds are unsigned (macOS: ad hoc):
#   MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD           Developer ID Application certificate (.p12, base64)
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   notarization (needs the certificate too)
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD           Windows code-signing certificate (.pfx, base64)
# A secret that isn't set arrives as an empty string, which electron-builder.config.mjs ignores.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        name: Check the tag against the app's version
        run: |
          version=$(jq -r .version apps/desktop/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/desktop/package.json, whose version is $version. Tag v$version instead, or change the version."
            exit 1
          fi
          echo "Building Helix $version from $GITHUB_REF_TYPE $GITHUB_REF_NAME"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            os: macos-latest
          - platform: win
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (pnpm version from package.json's packageManager)
        with:
          cache: true
      - run: pnpm install --frozen-lockfile

      - name: Build the macOS dmgs (Apple silicon and Intel)
        if: matrix.platform == 'mac'
        run: pnpm --filter @helix/desktop dist:mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build the Windows installer
        if: matrix.platform == 'win'
        run: pnpm --filter @helix/desktop dist:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Build the Linux AppImage and deb
        if: matrix.platform == 'linux'
        run: pnpm --filter @helix/desktop dist:linux

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helix-${{ matrix.platform }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Check the files
        env:
          VERSION: ${{ needs.version.outputs.version }}
        # These names are the contract with the app's update check: one file per OS and processor.
        run: |
          ls -l dist
          for file in "Helix-$VERSION-arm64.dmg" "Helix-$VERSION-x64.dmg" "Helix-Setup-$VERSION-x64.exe" "Helix-$VERSION-x86_64.AppImage" "Helix-$VERSION-amd64.deb"; do
            [ -f "dist/$file" ] || { echo "::error::Missing dist/$file"; exit 1; }
          done
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $TAG is already published; its files stay as they are."
              exit 1
            fi
            echo "Draft $TAG exists (a re-run): replacing its files."
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --draft --verify-tag --title "Helix $VERSION" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
